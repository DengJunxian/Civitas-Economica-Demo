name: civitas-ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ""
      ZHIPUAI_API_KEY: ""
      ZHIPU_API_KEY: ""
      LLM_DEFAULT_PROVIDER: auto
      LLM_TIMEOUT_SECONDS: "3"
      LLM_MAX_RETRIES: "0"
      CIVITAS_RANDOM_SEED: "42"
      STREAMLIT_SERVER_HEADLESS: "true"
      PYTHONHASHSEED: "42"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke import frontend
        run: python -c "import app; assert hasattr(app, 'main')"

      - name: Run tests
        run: pytest -q
